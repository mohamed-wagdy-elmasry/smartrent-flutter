workflows:
  ios-app-store:
    name: iOS App Store — SmartRent
    max_build_duration: 120
    instance_type: mac_mini_m2

    # ----------------------------------------------------------------
    # App Store Connect API key — set this in Codemagic UI:
    #   Teams > Integrations > App Store Connect > Add key
    # Then replace YOUR_APP_STORE_CONNECT_API_KEY with the integration name.
    # ----------------------------------------------------------------
    integrations:
      app_store_connect: smartrent_asc_key   # <-- rename to your key name in Codemagic UI

    environment:
      flutter: 3.32.8
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.next.smartrent
      vars:
        # These must be set as environment variables in Codemagic UI (encrypted):
        # GOOGLE_MAPS_IOS_KEY: AIzaSy...
        APP_STORE_CONNECT_ISSUER_ID: Encrypted(...)  # set in Codemagic UI
        APP_STORE_CONNECT_KEY_IDENTIFIER: Encrypted(...)
        APP_STORE_CONNECT_PRIVATE_KEY: Encrypted(...)

    scripts:
      - name: Set up Flutter
        script: flutter --version

      - name: Get Flutter packages
        script: flutter pub get

      - name: Install CocoaPods dependencies
        script: |
          cd ios
          pod install --repo-update

      - name: Apply Xcode signing profiles
        script: xcode-project use-profiles

      - name: Run Flutter analyze (fail on errors)
        script: flutter analyze --no-fatal-infos

      - name: Build signed IPA for App Store
        script: |
          flutter build ipa \
            --release \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log

    publishing:
      email:
        recipients:
          - developer@smartrent.sa   # <-- change to your email
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        # Upload to TestFlight for internal review first
        submit_to_testflight: true
        beta_groups:
          - Internal Testers
        # Set to true only when ready for public release
        submit_to_app_store: false
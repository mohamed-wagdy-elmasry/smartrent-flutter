name: Deploy iOS to App Store

on:
  workflow_dispatch:
    inputs:
      submit_to_testflight:
        description: 'Upload directly to TestFlight / App Store Connect'
        required: true
        type: boolean
        default: true
  push:
    tags:
      - 'v*'

jobs:
  build-and-deploy:
    name: Build & Deploy iOS
    runs-on: macos-14
    timeout-minutes: 90

    env:
      BUNDLE_ID: "com.next.smartrent"
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}
      APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
      CERTIFICATE_PRIVATE_KEY: ${{ secrets.CERTIFICATE_PRIVATE_KEY }}

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 4. Install Codemagic CLI tools
        run: |
          python -m pip install --upgrade pip
          pip3 install codemagic-cli-tools

      - name: 5. Initialize macOS Keychain
        run: |
          keychain initialize

      - name: 6. Fetch / Create Signing Files from Apple
        run: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create \
            --certificate-key "$CERTIFICATE_PRIVATE_KEY"

      - name: 7. Add Certificates to Keychain
        run: |
          keychain add-certificates

      - name: 8. Install Provisioning Profiles for Xcode
        run: |
          PROFILES_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES_DIR"
          for search_dir in "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles" "$HOME/Library/MobileDevice/Provisioning Profiles"; do
            if [ -d "$search_dir" ]; then
              for f in "$search_dir"/*.mobileprovision "$search_dir"/*.provisionprofile; do
                if [ -f "$f" ]; then
                  echo "Found profile: $f"
                  UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" /dev/stdin <<< $(security cms -D -i "$f") 2>/dev/null || true)
                  if [ -n "$UUID" ]; then
                    echo "-> Installing as UUID: $PROFILES_DIR/$UUID.mobileprovision"
                    cp -f "$f" "$PROFILES_DIR/$UUID.mobileprovision"
                  fi
                  cp -f "$f" "$PROFILES_DIR/" 2>/dev/null || true
                fi
              done
            fi
          done
          echo "Installed profiles in $PROFILES_DIR:"
          ls -la "$PROFILES_DIR"

      - name: 9. Apply Provisioning Profiles to Xcode Project
        run: |
          xcode-project use-profiles --export-options-plist=ios/ExportOptions.plist

      - name: 10. Install Flutter dependencies
        run: |
          flutter pub get

      - name: 11. Install CocoaPods dependencies
        run: |
          cd ios
          pod install --repo-update
          cd ..

      - name: 12. Run Flutter Analyze
        run: |
          flutter analyze --no-fatal-infos || true

      - name: 13. Build Signed IPA for App Store
        run: |
          BUILD_NUM=$(( 10 + ${{ github.run_number }} ))
          flutter build ipa \
            --release \
            --build-name=1.2.0 \
            --build-number=$BUILD_NUM \
            --export-options-plist=ios/ExportOptions.plist

      - name: 14. Save IPA as GitHub Artifact
        uses: actions/upload-artifact@v4
        with:
          name: smartrent-ios-ipa
          path: build/ios/ipa/*.ipa
          retention-days: 14

      - name: 15. Upload to App Store Connect / TestFlight
        if: ${{ github.event_name == 'push' || inputs.submit_to_testflight }}
        uses: apple-actions/upload-testflight-build@v5
        with:
          app-path: 'build/ios/ipa/*.ipa'
          issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          api-key-id: ${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}
          api-private-key: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          uses-non-exempt-encryption: 'false'
          wait-for-processing: false
